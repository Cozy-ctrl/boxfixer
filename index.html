<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Netlify Site</title>
    <meta
      name="description"
      content="A basic one-page site ready to deploy on Netlify."
    />
    <style>
      :root {
        --bg: #f7f5f2;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #5b5d63;
        --accent: #0a7a5c;
        --accent-dark: #07684e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 20%, #e8f8f1 0%, transparent 45%),
          radial-gradient(circle at 90% 10%, #fff2e3 0%, transparent 40%),
          var(--bg);
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .pill {
        background: #ebf9f4;
        color: var(--accent-dark);
        border: 1px solid #d3f0e4;
        border-radius: 999px;
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
        font-weight: 600;
      }

      main {
        margin-top: 4rem;
        background: color-mix(in oklab, var(--surface), transparent 10%);
        backdrop-filter: blur(3px);
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
      }

      p {
        margin: 1rem 0 0;
        color: var(--muted);
        max-width: 60ch;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .actions {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 0.75rem 1.1rem;
        border-radius: 10px;
        font-weight: 600;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-dark);
      }

      .btn-secondary {
        border: 1px solid #d8dadd;
        color: var(--text);
        background: #fff;
      }

      footer {
        margin-top: 2rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        main {
          padding: 1.5rem;
          margin-top: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">Starter Site</div>
        <div class="pill">Netlify Ready</div>
      </header>

      <main>
        <h1>Launch a simple site in minutes.</h1>
        <p>
          This is a basic one-page website scaffolded for Netlify hosting. Edit
          the text, colors, and links to make it your own, then deploy directly
          from this folder.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Get Started</a>
          <a class="btn btn-secondary" href="https://docs.netlify.com/" target="_blank" rel="noreferrer">Netlify Docs</a>
        </div>
      </main>

      <footer>
        Built as a static page for Netlify deployment.
      </footer>
    </div>
  </body>
</html>
